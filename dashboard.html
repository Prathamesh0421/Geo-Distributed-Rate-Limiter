        setRipples(p => [...p, { id, x:e.clientX-rect.left, y:e.clientY-rect.top }]);
        setTimeout(() => setRipples(p => p.filter(r=>r.id!==id)), 700);
        onClick(scenario.id);
      };

      return (
        <button ref={ref} onClick={fire} disabled={simRunning} className="scn-btn"
          style={{ background: isSelected ? '#1a1a1a' : '#0f0f0f',
            border: `1px solid ${isSelected ? scenario.color : '#1e1e1e'}`,
            borderRadius: 8, padding:'9px 10px', textAlign:'left', width:'100%',
            color:'inherit', position:'relative', overflow:'hidden',
            cursor: simRunning ? 'not-allowed' : 'pointer',
            opacity: simRunning && !isLive ? 0.5 : 1,
            transition: 'border-color 0.2s, background 0.2s' }}>
          {ripples.map(r=>(
            <div key={r.id} style={{ position:'absolute', left:r.x, top:r.y, width:4, height:4, borderRadius:'50%', background:`${scenario.color}30`, transform:'translate(-50%,-50%)', animation:'rippleExpand 0.7s ease-out forwards', pointerEvents:'none' }}/>
          ))}
          <div style={{ fontSize:11, fontWeight:700, color: isSelected ? scenario.color : '#9ca3af', marginBottom:2, display:'flex', alignItems:'center', gap:6 }}>
            {scenario.label}
            {isLive && <span style={{ fontSize:8, background:`${scenario.color}22`, color:scenario.color, padding:'1px 5px', borderRadius:3, fontWeight:800, letterSpacing:'0.05em' }}>LIVE</span>}
          </div>
          <div style={{ fontSize:9, color:'#505050', lineHeight:1.3 }}>{scenario.desc}</div>
        </button>
      );
    }

    // ─── ContainerRow ─────────────────────────────────────────────────────────
    const isContainerUp = (status='') => status === 'ok' || status.startsWith('Up');
    function ContainerRow({ name, status }) {
      const up = isContainerUp(status);
      const color = up ? '#10b981' : '#ef4444';
      const label = up ? (status === 'ok' ? 'ok' : status.replace(/^Up /,'')) : 'down';
      return (
        <div style={{ display:'flex', alignItems:'center', gap:8, padding:'5px 0', borderBottom:'1px solid #161616' }}>
          <div style={{ width:6, height:6, borderRadius:'50%', background:color, flexShrink:0, boxShadow:up?`0 0 5px ${color}66`:'none' }}/>
          <span style={{ fontSize:11, color:'#888', fontFamily:'monospace', flex:1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{name}</span>
          <span style={{ fontSize:10, color:up?'#10b98170':'#ef444470' }}>{label}</span>
        </div>
      );
    }

    // ─── LogEntry ─────────────────────────────────────────────────────────────
    function LogEntry({ entry }) {
      const c = { success:'#10b981', error:'#ef4444', warning:'#f59e0b', info:'#3b82f6' }[entry.type]||'#6b7280';
      return (
        <div className="row-new" style={{ display:'flex', gap:6, padding:'3px 0', borderBottom:'1px solid #141414' }}>
          <span style={{ fontSize:9, color:'#2e2e2e', fontFamily:'monospace', flexShrink:0, paddingTop:1 }}>{fmtTime(entry.ts)}</span>
          <span style={{ fontSize:11, color:c, lineHeight:1.4 }}>{entry.msg}</span>
        </div>
      );
    }

    // ─── ControlSidebar ───────────────────────────────────────────────────────
    function ControlSidebar({ ctrlStatus, logs, addLog, addToast, refreshCtrl, open, onClose, onViewPolicies }) {
      const [predictor, setPredictor] = useState('ewma');
      const [agentInt,  setAgentInt]  = useState(15);
      const [scenario,  setScenario]  = useState(null);
      const [duration,  setDuration]  = useState(60);
      const [busy,      setBusy]      = useState({});
      const [successK,  setSuccessK]  = useState({});

      // Scenario execution tracking
      const [runningScenario, setRunningScenario] = useState(null);
      const [simStart,        setSimStart]        = useState(null);
      const [simDur,          setSimDur]          = useState(null);
      const [countdown,       setCountdown]       = useState(null);

      const setLoad = (k,v) => setBusy(p=>({...p,[k]:v}));
      const bumpKey = (k)   => setSuccessK(p=>({...p,[k]:(p[k]??0)+1}));

      // Detect simulator completion and auto-deselect
      const simRunning  = ctrlStatus.simulator?.running;
      const prevRunRef  = useRef(false);
      useEffect(() => {
        if (prevRunRef.current && !simRunning && runningScenario) {
          addToast(`✓ ${runningScenario} completed`, 'success');
          addLog(`✓ ${runningScenario} completed`, 'success');
          setRunningScenario(null);
          setScenario(null);
          setSimStart(null);
          setSimDur(null);
        }
        prevRunRef.current = simRunning;
      }, [simRunning]); // eslint-disable-line

      // Countdown ticker
      useEffect(() => {
        if (!simStart || !simDur || !simRunning) { setCountdown(null); return; }
        let tid;
        const tick = () => {
          const left = Math.max(0, simDur - (Date.now()-simStart)/1000);
          setCountdown(Math.ceil(left));
          if (left > 0) tid = setTimeout(tick, 350);
        };
        tick();
        return () => clearTimeout(tid);
      }, [simStart, simDur, simRunning]);

      // Generic POST with loading + toast + log + success pulse
      const doPost = async (key, path, body, okMsg, logMsg) => {
        setLoad(key, true);
        try {
          const d = await ctrlPost(path, body);
          addToast(okMsg, 'success');
          addLog(logMsg + (d.pid?` (pid ${d.pid})`:d.policies_written!=null?` — ${d.policies_written} written`:''), 'success');
          bumpKey(key);
          setTimeout(refreshCtrl, 400);
          return d;
        } catch (e) {
          addToast(e.message, 'error');
          addLog(`Error: ${e.message}`, 'error');
        } finally {
          setLoad(key, false);
        }
      };

      const startAgent = () => doPost('agentStart', '/api/control/agent/start',
        { predictor, interval:Number(agentInt) }, 'Agent started', `Agent started (${predictor}, ${agentInt}s)`);

      const stopAgent = () => doPost('agentStop', '/api/control/agent/stop',
        null, 'Agent stopped', 'Agent stopped');

      const startScenario = async () => {
        if (!scenario) { addToast('Select a scenario first', 'warning'); return; }
        const d = await doPost('sim', '/api/control/scenario',
          { scenario, duration }, `Scenario started: ${scenario}`, `Scenario: ${scenario} (${duration}s)`);
        if (d) {
          setRunningScenario(scenario);
          setSimStart(Date.now());
          setSimDur(duration);
        }
      };

      const stopScenario = async () => {
        const d = await doPost('simStop', '/api/control/scenario/stop',
          { clear_overrides: true }, 'Scenario stopped', 'Scenario stopped — overrides cleared');
        if (d) {
          setRunningScenario(null);
          setSimStart(null);
          setSimDur(null);
          setCountdown(null);
        }
      };

      const seedPolicies    = () => doPost('seed',  '/api/control/policies/seed',   null, 'Policies seeded (9 written)', 'Policies seeded');
      const flushRedis      = () => doPost('flush', '/api/control/redis/flush',     null, 'All Redis data cleared',       'Redis flushed (FLUSHALL ×3)');
      const restartGateways = () => doPost('gw',    '/api/control/gateways/restart', null, 'Gateways restarted',          'Gateways restarted (us/eu/asia)');

      const { agent={}, simulator={}, containers=[] } = ctrlStatus;
      const uptime  = useAnimatedNumber(agent.uptime_seconds??0, 500);
      const allUp   = containers.length > 0 && containers.every(c=>isContainerUp(c.status));
      const downN   = containers.filter(c=>!isContainerUp(c.status)).length;
      const sliderPct = Math.round(((duration-30)/(300-30))*100);
      const progress  = simDur && countdown!=null ? Math.min(100, ((simDur-countdown)/simDur)*100) : 0;

      return (
        <div style={{ position:'fixed', top:0, right:0, bottom:0, width:320,
          background:'#111', borderLeft:'1px solid #1d1d1d', zIndex:200,
          display:'flex', flexDirection:'column', overflowY:'auto',
          transform: open ? 'translateX(0)' : 'translateX(100%)',
          transition: 'transform 0.42s cubic-bezier(0.22,1,0.36,1)',
          willChange: 'transform' }}>

          {/* Header */}
          <div style={{ padding:'14px 16px', borderBottom:'1px solid #1d1d1d', flexShrink:0, background:'#0d0d0d', position:'sticky', top:0, zIndex:10, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
            <div>
              <div style={{ fontSize:12, fontWeight:700, color:'#e5e7eb', letterSpacing:'-0.01em' }}>Control Panel</div>
              <div style={{ fontSize:10, color:'#383838', marginTop:1 }}>Demo controls</div>
            </div>
            <button onClick={onClose}
              style={{ width:28, height:28, borderRadius:6, background:'#1a1a1a', border:'1px solid #252525', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', color:'#555', fontSize:16, transition:'color 0.15s, background 0.15s' }}
              onMouseEnter={e=>{e.currentTarget.style.color='#ccc';e.currentTarget.style.background='#222';}}
              onMouseLeave={e=>{e.currentTarget.style.color='#555';e.currentTarget.style.background='#1a1a1a';}}>
              ×
            </button>
          </div>

          {/* ── Section 1: Agent Control ────────────────────────────────── */}
          <SidebarSection title="Agent Control" delay={60}>
            <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
              <div>
                <label style={{ fontSize:10, color:'#484848', display:'block', marginBottom:4 }}>Predictor model</label>
                <select className="ctrl-select" value={predictor} onChange={e=>setPredictor(e.target.value)}>
                  <option value="ewma">EWMA (fast, reactive)</option>
                  <option value="holtwinters">Holt-Winters (seasonal)</option>
                </select>
              </div>
              <div>
                <label style={{ fontSize:10, color:'#484848', display:'block', marginBottom:4 }}>Tick interval (seconds)</label>
                <input className="ctrl-input" type="number" min={5} max={60} value={agentInt}
                  onChange={e=>setAgentInt(e.target.value)}/>
              </div>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:6 }}>
                <MagneticBtn variant="green" onClick={startAgent} loading={busy.agentStart} disabled={agent.running} successKey={successK.agentStart??0}>
                  Start Agent
                </MagneticBtn>
                <MagneticBtn variant="red" onClick={stopAgent} loading={busy.agentStop} disabled={!agent.running} successKey={successK.agentStop??0}>
                  Stop Agent
                </MagneticBtn>
              </div>
              <StatusDot
                running={agent.running}
                label={agent.running ? 'Running' : 'Stopped'}
                sublabel={agent.running
                  ? `pid ${agent.pid} · ${fmtUptime(Math.round(uptime))}`
                  : 'Agent not running'}
              />
            </div>
          </SidebarSection>

          {/* ── Section 2: Traffic Scenarios ─────────────────────────── */}
          <SidebarSection title="Traffic Scenarios" delay={120}>
            <div style={{ display:'flex', flexDirection:'column', gap:9 }}>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:7 }}>
                {SCENARIOS.map(s => (
                  <ScenarioBtn key={s.id} scenario={s} selected={scenario}
                    simRunning={simRunning} runningScenario={runningScenario}
                    onClick={setScenario}/>
                ))}
              </div>

              {/* Progress bar + countdown */}
              {simRunning && runningScenario && (
                <div>
                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:5 }}>
                    <span style={{ fontSize:10, color:'#555' }}>{runningScenario}</span>
                    {countdown!=null && <span style={{ fontSize:11, color:'#3b82f6', fontVariantNumeric:'tabular-nums', fontWeight:600 }}>{countdown}s left</span>}
                  </div>
                  <div style={{ height:3, background:'#1a1a1a', borderRadius:2 }}>
                    <div style={{ height:'100%', width:`${progress}%`, background:'linear-gradient(90deg,#3b82f6,#a855f7)', borderRadius:2, transition:'width 0.35s linear' }}/>
                  </div>
                </div>
              )}

              {/* Duration slider */}
              <div>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:5 }}>
                  <label style={{ fontSize:10, color:'#484848' }}>Duration</label>
                  <span style={{ fontSize:12, color:'#3b82f6', fontVariantNumeric:'tabular-nums', fontWeight:600 }}>{duration}s</span>
                </div>
                <input type="range" min={30} max={300} step={30} value={duration}
                  onChange={e=>setDuration(Number(e.target.value))}
                  style={{ width:'100%', cursor:'pointer',
                    background:`linear-gradient(to right,#3b82f6 ${sliderPct}%,#1e1e1e ${sliderPct}%)`,
                    borderRadius:2, height:4 }}/>
                <div style={{ display:'flex', justifyContent:'space-between', marginTop:4 }}>
                  {[30,60,120,180,300].map(v=>(
                    <span key={v} onClick={()=>!simRunning&&setDuration(v)}
                      style={{ fontSize:9, color:duration===v?'#3b82f6':'#2e2e2e', cursor:simRunning?'default':'pointer', fontVariantNumeric:'tabular-nums', transition:'color 0.15s' }}>
                      {v}s
                    </span>
                  ))}
                </div>
              </div>

              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:6 }}>
                <MagneticBtn variant="blue" onClick={startScenario}
                  loading={busy.sim} disabled={simRunning||!scenario} successKey={successK.sim??0}>
                  {simRunning ? `Running · pid ${simulator.pid??'…'}` : (scenario ? `Start ${scenario}` : 'Select scenario')}
                </MagneticBtn>
                <MagneticBtn variant="red" onClick={stopScenario}
                  loading={busy.simStop} disabled={!simRunning} successKey={successK.simStop??0}>
                  Stop
                </MagneticBtn>
              </div>
            </div>
          </SidebarSection>

          {/* ── Section 3: Quick Actions ──────────────────────────────── */}
          <SidebarSection title="Quick Actions" delay={180}>
            <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
              <MagneticBtn variant="orange" fullWidth onClick={seedPolicies} loading={busy.seed} successKey={successK.seed??0}>
                Seed Demo Policies
              </MagneticBtn>
              <MagneticBtn variant="blue" fullWidth onClick={onViewPolicies}>
                View Current Policies
              </MagneticBtn>
              <MagneticBtn variant="red" fullWidth onClick={flushRedis} loading={busy.flush} successKey={successK.flush??0}>
                Flush All Redis
              </MagneticBtn>
              <MagneticBtn fullWidth onClick={restartGateways} loading={busy.gw} successKey={successK.gw??0}>
                Restart Gateways
              </MagneticBtn>
            </div>
          </SidebarSection>

          {/* ── Section 4: Container Health ───────────────────────────── */}
          <SidebarSection title="Container Health" delay={240}>
            <div style={{ marginBottom:9, padding:'7px 10px',
              background:allUp?'#10b98112':'#ef444412',
              border:`1px solid ${allUp?'#10b98130':'#ef444430'}`,
              borderRadius:7, fontSize:11,
              color:allUp?'#10b981':'#ef4444', fontWeight:600 }}>
              {containers.length===0 ? 'Checking…'
                : allUp ? `All ${containers.length} containers healthy`
                : `${downN} container${downN!==1?'s':''} down`}
            </div>
            <div style={{ maxHeight:200, overflowY:'auto' }}>
              {containers.length===0
                ? [...Array(5)].map((_,i)=><div key={i} style={{ marginBottom:6 }}><Skeleton h={18}/></div>)
                : containers.map((c,i)=><ContainerRow key={i} name={c.name} status={c.status}/>)}
            </div>
          </SidebarSection>

          {/* ── Section 5: System Logs ────────────────────────────────── */}
          <SidebarSection title="System Logs" delay={300}>
            <div style={{ maxHeight:160, overflowY:'auto', display:'flex', flexDirection:'column-reverse' }}>
              {logs.length===0
                ? <div style={{ fontSize:11, color:'#2a2a2a', textAlign:'center', padding:'16px 0' }}>No actions yet</div>
                : [...logs].reverse().map(e=><LogEntry key={e.id} entry={e}/>)}
            </div>
          </SidebarSection>
        </div>
      );
    }

    // ─── TierHealthPanel ──────────────────────────────────────────────────────
    const RTooltip = Tooltip;

    function TierHealthPanel({ latency, loading, onExpand, totalRps = 0, agentRunning = false, overrides = [] }) {
      const noTraffic = totalRps < 0.1;
      const ms       = noTraffic ? 0 : (latency?.tier_latency_ms ?? 0);
      const count    = latency?.congestion_count ?? 0;
      const abusers  = latency?.abusers ?? [];

      // Merge override list into abuser display: any user with an active override
      // should appear here even if the latency probe hasn't flagged them yet.
      const overrideMap = Object.fromEntries(overrides.map(ov => [ov.user_id, ov]));
      const abusersWithOverride = abusers.map(a => ({
        ...a,
        hasOverride: !!overrideMap[a.user_id],
        overrideLimit: overrideMap[a.user_id]?.limit_per_minute ?? a.limit_per_minute,
      }));
      const overrideOnlyUsers = overrides.filter(ov => !abusers.some(a => a.user_id === ov.user_id));
      const displayAbusers = [
        ...abusersWithOverride,
        ...overrideOnlyUsers.map(ov => ({
          user_id: ov.user_id,
          limit_per_minute: ov.limit_per_minute,
          hasOverride: true,
          overrideLimit: ov.limit_per_minute,
          overrideOnly: true,
        })),
      ];
      const spark    = (latency?.tier_latency_spark ?? []).map(p => ({ t: p.t, v: p.v }));

      const color  = noTraffic ? '#3a3a3a' : ms >= 100 ? '#ef4444' : ms >= 20 ? '#f59e0b' : '#10b981';
      const label  = noTraffic ? 'NO TRAFFIC' : ms >= 100 ? 'DEGRADED' : ms >= 20 ? 'ELEVATED' : 'HEALTHY';
      const icon   = noTraffic ? '⚫' : ms >= 100 ? '🔴' : ms >= 20 ? '🟡' : '🟢';
      const animMs = useAnimatedNumber(ms);

      const expandData = { type:'sparkline', title:'Tier Backend Latency', data:spark, color, unit:'ms' };

      if (noTraffic && overrides.length === 0) return (
        <Panel>
          <PanelHeader title="Legitimate User Health" badge={
            <span style={{ fontSize:10, fontWeight:700, color:'#3a3a3a', letterSpacing:'0.10em',
              padding:'2px 8px', borderRadius:4, background:'#1e1e1e', border:'1px solid #2a2a2a' }}>
              ⚫ US · FREE TIER
            </span>
          }/>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'center', minHeight:88, gap:10 }}>
            <div style={{ fontSize:13, color:'#333' }}>No active traffic</div>
            <div style={{ fontSize:11, color:'#282828' }}>— start a scenario to see tier latency</div>
          </div>
        </Panel>
      );

      return (
        <Panel>
          <PanelHeader title="Legitimate User Health" badge={
            <span style={{ fontSize:10, fontWeight:700, color, letterSpacing:'0.10em',
              padding:'2px 8px', borderRadius:4, background:`${color}18`, border:`1px solid ${color}35` }}>
              {icon} US · FREE TIER
            </span>
          }/>
          <div style={{ display:'flex', gap:0, minHeight:88 }}>

            {/* Status badge */}
            <div style={{ minWidth:140, display:'flex', flexDirection:'column', alignItems:'center',
              justifyContent:'center', gap:4, borderRight:'1px solid #1a1a1a', padding:'0 20px' }}>
              <div style={{ fontSize:30, fontWeight:800, color, fontVariantNumeric:'tabular-nums',
                transition:'color 0.5s ease' }}>
                {animMs.toFixed(0)}<span style={{ fontSize:14, fontWeight:500, color:'#555', marginLeft:2 }}>ms</span>
              </div>
              <div style={{ fontSize:9, fontWeight:700, letterSpacing:'0.14em', color,
                padding:'2px 7px', borderRadius:3, background:`${color}15`, border:`1px solid ${color}30` }}>
                {label}
              </div>
              <div style={{ fontSize:9, color:'#333', marginTop:2 }}>backend latency</div>
            </div>

            {/* Sparkline */}
            <div style={{ flex:1, minWidth:0, padding:'10px 14px 6px', cursor:'pointer' }}
              onClick={() => onExpand?.(expandData)}>
              <div style={{ fontSize:9, color:'#2e2e2e', marginBottom:2, letterSpacing:'0.08em' }}>
                LATENCY HISTORY (90s) — click to expand
              </div>
              {spark.length === 0
                ? <div style={{ display:'flex', alignItems:'center', justifyContent:'center', height:56, color:'#2a2a2a', fontSize:11 }}>
                    No data — run noisy_neighbor scenario
                  </div>
                : <RC2 width="100%" height={56}>
                    <LineChart data={spark}>
                      <Line type="monotone" dataKey="v" stroke={color} strokeWidth={1.5}
                        dot={false} isAnimationActive={false}/>
                      <ReferenceLine y={100} stroke="#ef444435" strokeDasharray="3 3"/>
                      <ReferenceLine y={20}  stroke="#10b98130" strokeDasharray="3 3"/>
                      <RTooltip content={({ payload }) =>
                        payload?.[0]
                          ? <div style={{ fontSize:10, color:'#aaa', padding:'2px 6px',
                              background:'#1a1a1a', border:'1px solid #2a2a2a', borderRadius:4 }}>
                              {Number(payload[0].value).toFixed(0)}ms
                            </div>
                          : null
                      }/>
                    </LineChart>
                  </RC2>
              }
            </div>

            {/* Abuser status column */}
            <div style={{ minWidth:200, borderLeft:'1px solid #1a1a1a', padding:'10px 14px',
              display:'flex', flexDirection:'column', gap:5 }}>
              <div style={{ fontSize:9, fontWeight:700, color:'#2e2e2e', letterSpacing:'0.10em', marginBottom:2 }}>
                ACTIVE OVERRIDES
              </div>
              {loading
                ? [0,1].map(i => <Skeleton key={i} h={22}/>)
                : displayAbusers.length === 0
                  ? <div style={{ fontSize:11, color:'#2a2a2a', marginTop:4 }}>
                      {ms < 20
                        ? <span style={{ color:'#10b98199' }}>✓ No abusers detected</span>
                        : !agentRunning
                          ? <span style={{ color:'#ef444499' }}>Agent not running</span>
                          : <span style={{ color:'#f59e0b99' }}>Tier congestion — no single abuser</span>}
                    </div>
                  : displayAbusers.map(a => {
                    const subdued = a.hasOverride;
                    const dotColor   = subdued ? '#f59e0b' : '#ef4444';
                    const bgColor    = subdued ? '#f59e0b12' : '#ef444412';
                    const borderColor= subdued ? '#f59e0b30' : '#ef444430';
                    const limitColor = subdued ? '#f59e0b'   : '#ef4444';
                    return (
                      <div key={a.user_id} style={{ display:'flex', alignItems:'center', gap:7,
                        background:bgColor, border:`1px solid ${borderColor}`, borderRadius:6,
                        padding:'4px 8px', animation:'overrideGlow 2.5s ease-in-out infinite' }}>
                        <div style={{ width:5, height:5, borderRadius:'50%', background:dotColor, flexShrink:0 }}/>
                        <span style={{ fontSize:10, fontFamily:'monospace', color:'#f3f4f6', flex:1 }}>
                          {a.user_id}
                        </span>
                        {subdued && (
                          <span style={{ fontSize:8, color:'#f59e0b', fontWeight:700, letterSpacing:'0.06em',
                            background:'#f59e0b18', border:'1px solid #f59e0b30', borderRadius:3, padding:'1px 4px' }}>
                            SUBDUED
                          </span>
                        )}
                        <span style={{ fontSize:9, color:limitColor, fontWeight:700 }}>
                          {a.overrideLimit}/min
                        </span>
                      </div>
                    );
                  })
              }
              {displayAbusers.length > 0 && ms < 20 && (
                <div style={{ fontSize:9, color:'#10b981', marginTop:3, lineHeight:1.4 }}>
                  ✓ Throttled — tier recovered
                </div>
              )}
              <div style={{ marginTop:'auto', fontSize:9, color:'#252525' }}>
                fires &gt; 250 req / 30s window
              </div>
            </div>

          </div>
        </Panel>
      );
    }

    // ─── Header ───────────────────────────────────────────────────────────────
    function Header({ connected, lastUpdate }) {
      return (
        <div style={{ background:'#0e0e0ecc', backdropFilter:'blur(12px)', borderBottom:'1px solid #1a1a1a',
          padding:'14px 32px', display:'flex', justifyContent:'space-between', alignItems:'center',
          position:'sticky', top:0, zIndex:100 }}>
          <div>
            <h1 style={{ fontSize:17, fontWeight:700, letterSpacing:'-0.02em',
              background:'linear-gradient(90deg,#e5e7eb 60%,#6b7280)',
              WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent' }}>
              Geo-Distributed Rate Limiter
            </h1>
            <p style={{ fontSize:11, color:'#383838', marginTop:2 }}>AI-powered traffic control · 3-region cluster · CRDT sync</p>
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:20 }}>
            {lastUpdate && <span style={{ fontSize:11, color:'#333' }}>Updated {fmtTime(lastUpdate)}</span>}
            <div style={{ display:'flex', alignItems:'center', gap:7 }}>
              <div style={{ width:7, height:7, borderRadius:'50%', background:connected?'#10b981':'#ef4444',
                boxShadow:connected?'0 0 8px #10b981bb':'none',
                animation:connected?'dotPulse 2.5s ease-in-out infinite':'none' }}/>
              <span style={{ fontSize:12, color:connected?'#10b981':'#ef4444' }}>{connected?'Live':'Disconnected'}</span>
            </div>
          </div>
        </div>
      );
    }

    function Footer({ connected }) {
      return (
        <div style={{ textAlign:'center', padding:'20px 0 28px', borderTop:'1px solid #131313', marginTop:8 }}>
          <span style={{ fontSize:11, color:'#242424' }}>
            Geo-Distributed Rate Limiter · CMPE 273 · Refreshes every 5s · {connected?'● Live':'○ Offline'}
          </span>
        </div>
      );
    }

    // ─── App ──────────────────────────────────────────────────────────────────
    function App() {
      const [state, setState] = useState({ metrics:null, decisions:[], overrides:[], counters:[], connected:false, loading:true, lastUpdate:null });
      const [ctrlStatus, setCtrlStatus] = useState({ agent:{running:false}, simulator:{running:false}, containers:[] });
      const [logs,        setLogs]       = useState([]);
      const [toasts,      setToasts]     = useState([]);
      const [sidebarOpen,   setSidebarOpen]   = useState(true);
      const [modal,         setModal]         = useState(null);
      const [policiesOpen,  setPoliciesOpen]  = useState(false);
      const [modelMetrics,  setModelMetrics]  = useState(null);
      const [latencyData,   setLatencyData]   = useState(null);
      const [demoResults,   setDemoResults]   = useState(null);
      const [lastActiveTs,  setLastActiveTs]  = useState(0);

      const openModal  = useCallback((chart) => setModal(chart), []);
      const closeModal = useCallback(() => setModal(null), []);

      const load = useCallback(async () => {
        try {
          const r = await fetchAll();
          setState(p => ({ ...p, ...r, connected:r.ok, loading:false, lastUpdate:Date.now() }));
          if ((r.metrics?.total_rps ?? 0) > 0.05) setLastActiveTs(Date.now());
        } catch { setState(p => ({ ...p, connected:false, loading:false })); }
      }, []);

      const loadCtrl = useCallback(async () => {
        try { setCtrlStatus(await fetchCtrlStatus()); } catch {}
      }, []);

      const loadModel = useCallback(async () => {
        try { setModelMetrics(await fetchModelMetrics()); } catch {}
      }, []);

      const loadLatency = useCallback(async () => {
        try { setLatencyData(await fetchLatency()); } catch {}
      }, []);

      const loadDemo = useCallback(async () => {
        try { setDemoResults(await fetchDemoResults()); } catch {}
      }, []);

      useEffect(() => {
        load();        const i1 = setInterval(load,        REFRESH_MS);
        loadCtrl();    const i2 = setInterval(loadCtrl,    REFRESH_MS);
        loadModel();   const i3 = setInterval(loadModel,   REFRESH_MS);
        loadLatency(); const i4 = setInterval(loadLatency, REFRESH_MS);
        loadDemo();    const i5 = setInterval(loadDemo,    REFRESH_MS);
        return () => { clearInterval(i1); clearInterval(i2); clearInterval(i3); clearInterval(i4); clearInterval(i5); };
      }, [load, loadCtrl, loadModel, loadLatency, loadDemo]);

      const addLog = useCallback((msg, type='info') => {
        setLogs(p => [...p.slice(-49), { id:Date.now()+Math.random(), ts:Date.now(), msg, type }]);
      }, []);

      const addToast = useCallback((msg, type='info') => {
        const id = Date.now()+Math.random();
        setToasts(p => [...p, { id, msg, type }]);
        setTimeout(() => setToasts(p => p.filter(t=>t.id!==id)), 3500);
      }, []);

      const { metrics, decisions, overrides, counters, connected, loading, lastUpdate } = state;
      const rpsSpk   = metrics?.sparklines?.rps        ?? [];
      const allowSpk = metrics?.sparklines?.allow_rate ?? [];
      const usersSpk = metrics?.sparklines?.users      ?? [];
      const isLive   = (Date.now() - lastActiveTs) < 10000;

      return (
        <div style={{ minHeight:'100vh', background:'#0a0a0a', position:'relative' }}>
          <GradientBackground/>
          <ToastStack toasts={toasts} sidebarOpen={sidebarOpen}/>
          {modal        && <ChartModal  chart={modal} onClose={closeModal}/>}
          {policiesOpen && <PolicyModal onClose={() => setPoliciesOpen(false)}/>}

          {/* Toggle button — only visible when sidebar is closed */}
          {!sidebarOpen && <ToggleBtn onClick={()=>setSidebarOpen(true)}/>}

          {/* Main content — shrinks to make room for sidebar */}
          <div style={{ position:'relative', zIndex:1,
            paddingRight: sidebarOpen ? 320 : 0,
            transition: 'padding-right 0.42s cubic-bezier(0.22,1,0.36,1)' }}>

            <Header connected={connected} lastUpdate={lastUpdate}/>

            <div style={{ padding:'24px 32px 0', display:'flex', flexDirection:'column', gap:16 }}>

              {(() => {
                // Compute peak60s for the Tier Latency tile so the demo
                // viewer doesn't miss the spike if they look up a few seconds
                // late after the agent has already kicked in. Peak is shown
                // only when it's >10% higher than the current reading.
                const sparkRaw = latencyData?.tier_latency_spark ?? [];
                const cutoff = Date.now() - 60_000;
                const recent = sparkRaw.filter(p => p.t && p.t >= cutoff);
                let peakLat = null;
                if (recent.length) {
                  const top = recent.reduce((a, b) => (b.v ?? 0) > (a.v ?? 0) ? b : a, recent[0]);
                  peakLat = { value: top.v ?? 0, unit: 'ms', ageSeconds: Math.max(0, Math.round((Date.now() - top.t) / 1000)) };
                }
                return (
              <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:14 }}>
                <MetricCard title="Total RPS"      rawValue={metrics?.total_rps??null}       decimals={1} unit="req/s" sub="across all regions" color="#10b981" spark={rpsSpk}   loading={loading} onExpand={openModal} live={isLive}/>
                <MetricCard title="Allow Rate"     rawValue={metrics?.allow_rate??null}       decimals={1} unit="%"     sub="of all requests"   color="#3b82f6" spark={allowSpk} loading={loading} onExpand={openModal} live={isLive}/>
                <MetricCard title="Tier Latency"   rawValue={latencyData?.tier_latency_ms??null} decimals={0} unit="ms" sub="US free tier congestion"
                  color={latencyData?.tier_latency_ms >= 100 ? '#ef4444' : latencyData?.tier_latency_ms >= 20 ? '#f59e0b' : '#10b981'}
                  spark={(latencyData?.tier_latency_spark??[]).map(p=>({v:p.v}))} loading={loading} onExpand={openModal} live={isLive} peak={peakLat}/>
                <MetricCard title="AI Decisions"   rawValue={metrics?.recent_decisions??null} isInt               sub="last 24 hours"        color="#f59e0b" spark={[]}       loading={loading} onExpand={openModal}/>
              </div>
                );
              })()}

              <TierHealthPanel latency={latencyData} loading={loading} onExpand={openModal} totalRps={metrics?.total_rps ?? 0} agentRunning={!!ctrlStatus?.agent?.running} overrides={overrides}/>

              <ModelPerformancePanel modelData={modelMetrics} onExpand={openModal}/>

              <div style={{ display:'grid', gridTemplateColumns:'3fr 2fr', gap:14 }}>
                <DecisionsFeed decisions={decisions} loading={loading}/>
                <OverridesTable overrides={overrides} loading={loading}/>
              </div>

              <BypassPanel data={demoResults} loading={loading}/>

              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:14 }}>
                <CounterChart counters={counters} loading={loading} onExpand={openModal}/>
                <TopUsers counters={counters} loading={loading}/>
              </div>
            </div>

            <Footer connected={connected}/>
          </div>

          <ControlSidebar
            ctrlStatus={ctrlStatus} logs={logs} addLog={addLog} addToast={addToast}
            refreshCtrl={loadCtrl} open={sidebarOpen} onClose={()=>setSidebarOpen(false)}
            onViewPolicies={() => setPoliciesOpen(true)}
          />
        </div>
      );
    }

    // ─── Mount ────────────────────────────────────────────────────────────────
    try {
      const fb = document.getElementById('loading-fallback');
      ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
      if (fb) fb.style.display = 'none';
    } catch (err) {
      const el = document.getElementById('fallback-error');
      if (el) { el.style.display='block'; el.textContent='React mount error: '+err.message; }
      console.error('React mount failed:', err);
    }
  </script>
</body>
</html>
